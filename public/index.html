<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Week 2 API</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 60px auto; padding: 0 20px; line-height: 1.6; color: #202938; }
    h1 { color: #b42332; }
    code { background: #f1f3f5; padding: 3px 6px; border-radius: 4px; }
    li { margin: 10px 0; }
  </style>
</head>
<body>
  <h1>My Week 2 API!</h1>
  <p>Welcome. This is the static HTML homepage for the Week 2 Express assignment.</p>
  <h2>Available endpoints</h2>
  <ul>
    <li><code>GET /api</code> — returns the API welcome message as JSON.</li>
    <li><code>POST /user</code> — send JSON containing <code>name</code> and <code>email</code>.</li>
    <li><code>GET /user/:id</code> — returns a profile message for the given ID.</li>
  </ul>
</body>
</html>
